<input id="videoId" placeholder="YouTube 영상 ID">
<button onclick="openVideo()">열기</button>

<script>
function openVideo() {
    const id = document.getElementById("videoId").value.trim();

    if (!id) {
        return;
    }

    window.open(
        "https://www.youtube.com/watch?v=" + encodeURIComponent(id),
        "_blank"
    );
}
</script>
